name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Create Vercel project settings
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_jC7wCHEbBkyO997r3wY7fqZWG3r3","orgId":"team_3OM4y3AS1j8DnuGgPoehfcwK"}' > .vercel/project.json

      - name: Deploy to Vercel Production
        run: vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: team_3OM4y3AS1j8DnuGgPoehfcwK
          VERCEL_PROJECT_ID: prj_jC7wCHEbBkyO997r3wY7fqZWG3r3
